<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acharya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#f1f5f9 }
img { pointer-events:none }
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="min-h-screen flex flex-col items-center justify-center gap-4">
  <h1 class="text-3xl font-bold text-purple-600">Acharya</h1>

  <button onclick="login('teacher')" class="bg-green-600 text-white px-6 py-2 rounded">
    Teacher Login
  </button>

  <button onclick="login('student')" class="bg-blue-600 text-white px-6 py-2 rounded">
    Student Login
  </button>

  <button onclick="login('guest')" class="bg-gray-600 text-white px-6 py-2 rounded">
    Skip & Browse
  </button>

  <p class="text-xs text-gray-400">Admin is hidden 🔒</p>
</div>

<!-- MAIN SITE -->
<div id="mainSite" class="hidden">

<nav class="bg-white shadow p-4 flex justify-between">
  <h2 class="font-bold text-purple-600">Acharya</h2>

  <div class="flex gap-2">
    <button onclick="showTab('feed')" class="tabBtn">Feed</button>
    <button onclick="showTab('papers')" class="tabBtn">Question Papers</button>
    <button onclick="showTab('materials')" class="tabBtn">Materials</button>
    <button id="adminTab" onclick="showTab('admin')" class="tabBtn bg-purple-600 text-white hidden">
      Admin
    </button>
    <button onclick="logout()" class="tabBtn bg-red-500 text-white">Logout</button>
  </div>
</nav>

<div class="p-6 max-w-6xl mx-auto">

<!-- FEED -->
<div id="feed" class="tab">
  <h3 class="text-xl font-bold mb-4">Feed</h3>

  <div id="teacherPost" class="hidden mb-3">
    <textarea id="feedText" class="border p-2 w-full mb-2" placeholder="Write update..."></textarea>
    <button onclick="postFeed()" class="bg-green-600 text-white px-4 py-2 rounded">Post</button>
  </div>

  <div id="feedPosts" class="space-y-2"></div>
</div>

<!-- PAPERS -->
<div id="papers" class="tab hidden">
  <h3 class="text-xl font-bold mb-3">Question Papers</h3>

  <select id="paperCourse" class="border p-2 mb-2 w-full" onchange="filterPapers()">
    <option value="">Select Course</option>
    <option>MBA</option>
    <option>B.Tech</option>
    <option>Degree</option>
  </select>

  <select id="paperYear" class="border p-2 mb-2 w-full" onchange="filterPapers()">
    <option value="">Select Year</option>
    <option>2025</option>
    <option>2024</option>
    <option>2023</option>
  </select>

  <select id="paperSemester" class="border p-2 mb-4 w-full" onchange="filterPapers()">
    <option value="">Select Semester</option>
    <option>1</option><option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <div id="paperList" class="grid grid-cols-2 gap-4"></div>
</div>

<!-- MATERIALS -->
<div id="materials" class="tab hidden">
  <h3 class="text-xl font-bold mb-3">Materials</h3>

  <select id="materialCourse" class="border p-2 mb-2 w-full" onchange="filterMaterials()">
    <option value="">Select Course</option>
    <option>MBA</option>
    <option>B.Tech</option>
    <option>Degree</option>
  </select>

  <select id="materialSemester" class="border p-2 mb-4 w-full" onchange="filterMaterials()">
    <option value="">Select Semester</option>
    <option>1</option><option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <div id="materialList" class="grid grid-cols-2 gap-4"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="tab hidden">
  <h3 class="text-xl font-bold mb-4">Admin Upload</h3>

  <select id="uploadType" class="border p-2 w-full mb-2">
    <option value="paper">Question Paper</option>
    <option value="material">Material</option>
  </select>

  <input id="titleInput" class="border p-2 w-full mb-2" placeholder="Title">

  <select id="courseSelect" class="border p-2 w-full mb-2">
    <option value="">Select Course</option>
    <option>MBA</option>
    <option>B.Tech</option>
    <option>Degree</option>
  </select>

  <select id="yearSelect" class="border p-2 w-full mb-2">
    <option value="">Select Year (Papers)</option>
    <option>2025</option>
    <option>2024</option>
    <option>2023</option>
  </select>

  <select id="semesterSelect" class="border p-2 w-full mb-2">
    <option value="">Select Semester</option>
    <option>1</option><option>2</option><option>3</option><option>4</option>
    <option>5</option><option>6</option><option>7</option><option>8</option>
  </select>

  <input id="imageInput" type="file" accept="image/*" class="mb-3">

  <button onclick="uploadContent()" class="px-4 py-2 bg-purple-600 text-white rounded">
    Upload
  </button>
</div>

</div>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-white p-6 rounded w-80">
    <h3 class="font-bold mb-3">Admin Login</h3>
    <input id="adminPass" type="password" class="border p-2 w-full mb-3">
    <button onclick="checkAdmin()" class="bg-purple-600 text-white w-full py-2 rounded">
      Login
    </button>
  </div>
</div>

<script>
let currentUser = "guest";
const ADMIN_PASS = "acharya123";

let papers = [];
let materials = [];

/* AUTH */
function login(role){
  currentUser = role;
  loginPage.classList.add("hidden");
  mainSite.classList.remove("hidden");
  if(role==="teacher") teacherPost.classList.remove("hidden");
}
function logout(){ location.reload(); }

/* TABS */
function showTab(id){
  document.querySelectorAll(".tab").forEach(t=>t.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* FEED */
function postFeed(){
  if(currentUser!=="teacher") return;
  const d=document.createElement("div");
  d.className="bg-white p-3 rounded shadow";
  d.innerText="👨‍🏫 "+feedText.value;
  feedPosts.prepend(d);
  feedText.value="";
}

/* ADMIN UPLOAD */
function uploadContent(){
  if(currentUser!=="admin"){ alert("Admin only"); return; }

  const item={
    title:titleInput.value,
    course:courseSelect.value,
    year:yearSelect.value,
    semester:semesterSelect.value,
    type:uploadType.value,
    img:null
  };

  if(!item.title||!item.course||!item.semester||!imageInput.files[0]){
    alert("Fill all fields");
    return;
  }

  const file=imageInput.files[0];
  if(!file.type.startsWith("image/")){
    alert("Only images allowed");
    return;
  }

  const reader=new FileReader();
  reader.onload=()=>{
    item.img=reader.result;
    if(item.type==="paper"){ papers.push(item); filterPapers(); }
    else{ materials.push(item); filterMaterials(); }

    alert("Uploaded ✅");
    titleInput.value=courseSelect.value=yearSelect.value=semesterSelect.value=imageInput.value="";
  };
  reader.readAsDataURL(file);
}

/* RENDER */
function render(list,container){
  container.innerHTML="";
  list.forEach(i=>{
    container.innerHTML+=`
    <div class="bg-white p-2 rounded shadow">
      <img src="${i.img}" class="w-full h-40 object-cover rounded mb-2">
      <p class="font-semibold">${i.title}</p>
      <p class="text-sm text-gray-500">${i.course} | Sem ${i.semester} ${i.year||""}</p>
    </div>`;
  });
}

/* FILTERS */
function filterPapers(){
  render(
    papers.filter(p=>
      (!paperCourse.value||p.course===paperCourse.value)&&
      (!paperYear.value||p.year===paperYear.value)&&
      (!paperSemester.value||p.semester===paperSemester.value)
    ),
    paperList
  );
}
function filterMaterials(){
  render(
    materials.filter(m=>
      (!materialCourse.value||m.course===materialCourse.value)&&
      (!materialSemester.value||m.semester===materialSemester.value)
    ),
    materialList
  );
}

/* ADMIN SHORTCUT */
function checkAdmin(){
  if(adminPass.value===ADMIN_PASS){
    currentUser="admin";
    adminTab.classList.remove("hidden");
    adminLogin.classList.add("hidden");
    showTab("admin");
  } else alert("Wrong password");
}
document.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.shiftKey&&e.key==="A"){
    adminLogin.classList.remove("hidden");
  }
});
</script>

</body>
</html>
