<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Acharya</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f0f2f5;
}

header {
  background: #1e40af;
  color: white;
  padding: 16px;
  text-align: center;
  font-size: 26px;
  font-weight: bold;
}

nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  background: white;
  padding: 10px;
}

nav button {
  padding: 10px 18px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #e5e7eb;
  font-weight: 600;
}

nav button.active {
  background: #1e40af;
  color: white;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

select, input, button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.upload-btn {
  background: #1e40af;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.feed-item {
  margin-top: 20px;
}

.feed-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.feed-item img {
  width: 100%;
  border-radius: 10px;
  pointer-events: none;
  user-select: none;
}
</style>
</head>

<body oncontextmenu="return false">

<header>Acharya</header>

<nav> 
  <button id="feedBtn" onclick="showTab('feed')">📰 Feed</button>
  <button id="papersBtn" class="active" onclick="showTab('papers')">📚 Question Papers</button>
  <button id="materialsBtn" onclick="showTab('materials')">📖 Materials</button>

</nav>

<div class="container">

<!-- ADMIN -->
<div id="admin" class="card" style="display:none;">
  <h3>Admin Login</h3>
  <input type="password" id="adminPassword" placeholder="Enter admin password">
  <button class="upload-btn" onclick="adminLogin()">Unlock Admin</button>
  <p id="adminMsg"></p>

  <div id="adminPanel" style="display:none;">
    <hr>
    <h3>Upload Content (Images Only)</h3>

    <input type="text" id="uploadTitle" placeholder="Enter Title (Required)">

    <select id="uploadType">
      <option value="papers">Question Papers</option>
      <option value="materials">Materials</option>
    </select>

    <select id="uploadCourse">
      <option value="">Select Course</option>
      <option>MBA</option>
      <option>B.Tech</option>
      <option>BBA</option>
      <option>Degree</option>
    </select>

    <select id="uploadYear">
      <option value="">Select Year (Papers only)</option>
      <option>2025</option>
      <option>2024</option>
      <option>2023</option>
      <option>2022</option>
    </select>

    <input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp">
    <button class="upload-btn" onclick="uploadImage()">Upload Image</button>
    <p id="uploadMsg"></p>
  </div>
</div>

<!-- FEED -->
<div id="feed" class="card" style="display:none;">
  <h3>Latest Feed</h3>
  <div id="feedContent"></div>
</div>

<!-- PAPERS -->
<div id="papers" class="card">
  <h3>Question Papers</h3>

  <select id="paperCourse" onchange="filterPapers()">
    <option value="">Select Course</option>
    <option>MBA</option>
    <option>B.Tech</option>
    <option>BBA</option>
    <option>Degree</option>
  </select>

  <select id="paperYear" onchange="filterPapers()">
    <option value="">Select Year</option>
    <option>2025</option>
    <option>2024</option>
    <option>2023</option>
    <option>2022</option>
  </select>

  <div id="papersFeed"></div>
</div>

<!-- MATERIALS -->
<div id="materials" class="card" style="display:none;">
  <h3>Materials</h3>

  <select id="materialCourse" onchange="filterMaterials()">
    <option value="">Select Course</option>
    <option>MBA</option>
    <option>B.Tech</option>
    <option>BBA</option>
    <option>Degree</option>
  </select>

  <div id="materialsFeed"></div>
</div>

</div>

<script>
const ADMIN_PASSWORD = "acharya123";

let papers = [];
let materials = [];
let isAdmin = false;

function showTab(tab) {
  ["feed","papers","materials","admin"].forEach(t => {
    const el = document.getElementById(t);
    if (el) el.style.display = t === tab ? "block" : "none";

    const btn = document.getElementById(t + "Btn");
    if (btn) btn.classList.toggle("active", t === tab);
  });
}

function adminLogin() {
  if (adminPassword.value === ADMIN_PASSWORD) {
    isAdmin = true;
    adminPanel.style.display = "block";
    adminMsg.innerText = "✅ Admin unlocked";
  } else {
    adminMsg.innerText = "❌ Wrong password";
  }
}

function uploadImage() {
  if (!isAdmin) return;

  const title = uploadTitle.value.trim();
  const file = imageInput.files[0];

  if (!title) {
    uploadMsg.innerText = "❌ Title is required";
    return;
  }

  if (!file || !file.type.startsWith("image/")) {
    uploadMsg.innerText = "❌ Select a valid image";
    return;
  }

  const reader = new FileReader();
  reader.onload = () => {
    const data = {
      title,
      course: uploadCourse.value,
      year: uploadYear.value,
      img: reader.result
    };

    if (uploadType.value === "papers") {
      papers.push(data);
      filterPapers();
    } else {
      materials.push(data);
      filterMaterials();
    }

    uploadMsg.innerText = "✅ Uploaded successfully";
    uploadTitle.value = "";
    imageInput.value = "";
     renderFeed();
  };

  reader.readAsDataURL(file);
}

function filterPapers() {
  papersFeed.innerHTML = "";
  papers
    .filter(p => (!paperCourse.value || p.course === paperCourse.value) &&
                 (!paperYear.value || p.year === paperYear.value))
    .forEach(p => {
      papersFeed.innerHTML += `
        <div class="feed-item">
          <div class="feed-title">${p.title}</div>
          <img src="${p.img}">
        </div>
      `;
    });
}

function filterMaterials() {
  materialsFeed.innerHTML = "";
  materials
    .filter(m => !materialCourse.value || m.course === materialCourse.value)
    .forEach(m => {
      materialsFeed.innerHTML += `
        <div class="feed-item">
          <div class="feed-title">${m.title}</div>
          <img src="${m.img}">
        </div>
      `;
    });
}
// Secret shortcut: Ctrl + Shift + A
document.addEventListener("keydown", function (e) {
  if (e.ctrlKey && e.shiftKey && e.key === "A") {
    showAdminSecret();
  }
});

function showAdminSecret() {
  document.getElementById("admin").style.display = "block";
  document.getElementById("papers").style.display = "none";
  document.getElementById("materials").style.display = "none";
}
function renderFeed() {
  const feed = document.getElementById("feedContent");
  feed.innerHTML = "";

  const allItems = [...papers, ...materials];

  allItems.reverse().forEach(item => {
    feed.innerHTML += `
      <div class="feed-item">
        <div class="feed-title">${item.title}</div>
        <img src="${item.img}">
      </div>
    `;
  });
} 
showTab("feed");


</script>

</body>
</html>
